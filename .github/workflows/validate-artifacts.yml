name: Validate artifacts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: python -m compileall validate_artifacts.py experiments

      - name: Run validation unit tests
        run: python -m unittest discover -s tests

      - name: Validate committed artifact metadata
        run: python validate_artifacts.py --metadata-only
